ownership_note: >-
  Every first-party client library impact.com publishes lives in the github.com/saasquatch
  organisation and ships under the @saasquatch npm scope. That is not a third party: Advocate is
  the productised Referral SaaSquatch acquisition, and impact.com's own SDK overview pages link
  directly to these repositories as "Our iOS SDK" and "Our Android SDK". The Advocate API host is
  app.referralsaasquatch.com for the same reason.
summary:
  official_packages: 7
  registries: [npm, jitpack, spm, github]
  server_side_rest_clients: 0
  note: >-
    There is still NO first-party server-side client library for the Brand, Partner or Agency
    REST APIs in any language — no npm, PyPI, Maven Central, NuGet, RubyGems, Packagist,
    crates.io or pkg.go.dev package under an impact.com or Impact Radius namespace. Those 242
    operations are consumed directly over HTTP Basic. Everything published is Advocate-side.
