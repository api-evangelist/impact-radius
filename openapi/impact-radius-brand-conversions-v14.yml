openapi: 3.1.0
info:
  title: Brand API - Conversions
  description: >-
    API for submitting conversion events (e.g., sales, leads, subscriptions) to
    be reported on and potentially attributed to partners. Once a conversion is
    attributed, it becomes an Action.
  version: v13
  x-gitbook-description-document:
    object: document
    data:
      schemaVersion: 9
    nodes:
      - object: block
        type: paragraph
        isVoid: false
        data: {}
        nodes:
          - object: text
            leaves:
              - object: leaf
                text: >-
                  API for submitting conversion events (e.g., sales, leads,
                  subscriptions) to be reported on and potentially attributed to
                  partners. Once a conversion is attributed, it becomes an
                  Action.
                marks: []
            key: 7zYgC8SpW1H1
        key: sebstG3tAJKY
    key: Yt0l4mTVois2
  x-gitbook-description-html: >-
    <p>API for submitting conversion events (e.g., sales, leads, subscriptions)
    to be reported on and potentially attributed to partners. Once a conversion
    is attributed, it becomes an Action.</p>
servers:
  - url: https://api.impact.com
security:
  - basicAuth: []
paths:
  /Advertisers/{AccountSID}/Conversions:
    post:
      summary: Submit a Conversion Event
      description: >-
        Submits a conversion event for tracking and attribution.

          **Additional required parameters** not captured in the `required` list below:
          - One of `ActionTrackerId`, `EventTypeId`, or `EventTypeCode` is required (event identifier).
          - One of `ClickId`, `CustomerId`, `CustomProfileId`, `CustomClickId`, `PromoCode`, `MediaId`/`MediaPartnerId`, `UniqueUrl`, `CallerId`, `GoogAId`, `AndroidId`, `AppleIfa`, or `AppleIfv` is required (attribution key).

          **Note on conditional requirements:** Many parameters listed below as *optional* are conditionally required based on what else you submit. For example:
          - Item-level fields (`ItemSku[i]`, `ItemQuantity[i]`, `ItemPrice[i]`, `ItemSubTotal[i]`, etc.) become required when reporting at the item level.
          - `CurrencyCode` is required when monetary fields are provided.
          - Mobile-app fields (`AppleIfa`, `GoogAId`, `AppPackage`, `AppInstallRef`, `PropertyId`) are required for mobile-app install attribution.
          - Call-tracking fields (`PhoneNumber`, `CallerId`, `CountryCode`) are required for call-tracking conversions.

        It is highly recommended to provide as much data as possible for
        accurate attribution and payout calculation.
      operationId: submitConversion
      tags:
        - Conversions
      parameters:
        - name: AccountSID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        description: >-
          The details of the conversion event.


          **Additional required parameters** not captured in the `required` list
          below:

          - One of `ActionTrackerId`, `EventTypeId`, or `EventTypeCode` is
          required (event identifier).

          - One of `ClickId`, `CustomerId`, `CustomProfileId`, `CustomClickId`,
          `PromoCode`, `MediaId`/`MediaPartnerId`, `UniqueUrl`, `CallerId`, `GoogAId`,
          `AndroidId`, `AppleIfa`, or `AppleIfv` is required (attribution key).


          **Note on conditional requirements:** Many parameters listed below as
          *optional* are conditionally required based on what else you submit.
          For example:

          - Item-level fields (`ItemSku[i]`, `ItemQuantity[i]`, `ItemPrice[i]`,
          `ItemSubTotal[i]`, etc.) become required when reporting at the item
          level.

          - `CurrencyCode` is required when monetary fields are provided.

          - Mobile-app fields (`AppleIfa`, `GoogAId`, `AppPackage`,
          `AppInstallRef`, `PropertyId`) are required for mobile-app install
          attribution.

          - Call-tracking fields (`PhoneNumber`, `CallerId`, `CountryCode`) are
          required for call-tracking conversions.


          See each field's description for specific conditional requirements.
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConversionPayload'
        x-gitbook-description-html: >-
          <p>The details of the conversion event.</p>

          <p><strong>Additional required parameters</strong> not captured in the
          <code>required</code> list below:</p>

          <ul>

          <li>One of <code>ActionTrackerId</code>, <code>EventTypeId</code>, or
          <code>EventTypeCode</code> is required (event identifier).</li>

          <li>One of <code>ClickId</code>, <code>CustomerId</code>,
          <code>CustomProfileId</code>, <code>CustomClickId</code>,
          <code>PromoCode</code>, <code>MediaId</code>/<code>MediaPartnerId</code>,
          <code>UniqueUrl</code>, <code>CallerId</code>, <code>GoogAId</code>,
          <code>AndroidId</code>, <code>AppleIfa</code>, or
          <code>AppleIfv</code> is required (attribution key).</li>

          </ul>

          <p><strong>Note on conditional requirements:</strong> Many parameters
          listed below as <em>optional</em> are conditionally required based on
          what else you submit. For example:</p>

          <ul>

          <li>Item-level fields (<code>ItemSku[i]</code>,
          <code>ItemQuantity[i]</code>, <code>ItemPrice[i]</code>,
          <code>ItemSubTotal[i]</code>, etc.) become required when reporting at
          the item level.</li>

          <li><code>CurrencyCode</code> is required when monetary fields are
          provided.</li>

          <li>Mobile-app fields (<code>AppleIfa</code>, <code>GoogAId</code>,
          <code>AppPackage</code>, <code>AppInstallRef</code>,
          <code>PropertyId</code>) are required for mobile-app install
          attribution.</li>

          <li>Call-tracking fields (<code>PhoneNumber</code>,
          <code>CallerId</code>, <code>CountryCode</code>) are required for
          call-tracking conversions.</li>

          </ul>

          <p>See each field's description for specific conditional
          requirements.</p>
      responses:
        '200':
          description: The conversion event has been successfully queued for processing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status:
                    type: string
                    description: Indicates whether the conversion was successfully queued.
                    example: QUEUED
                    x-gitbook-description-html: >-
                      <p>Indicates whether the conversion was successfully
                      queued.</p>
                  QueuedUri:
                    type: string
                    format: uri-reference
                    description: The unique reference to the queued submission.
                    example: /Advertisers/<AccountSID>/APISubmissions/<SubmissionID>
                    x-gitbook-description-html: <p>The unique reference to the queued submission.</p>
          x-gitbook-description-html: >-
            <p>The conversion event has been successfully queued for
            processing.</p>
        '400':
          description: >-
            Bad Request. The request was invalid, likely due to missing required
            fields or incorrect data formats.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status:
                    type: string
                    description: Indicates that the request failed.
                    example: ERROR
                    x-gitbook-description-html: <p>Indicates that the request failed.</p>
                  errors:
                    type: array
                    description: >-
                      One or more validation errors describing what was wrong
                      with the request.
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                          description: The name of the field that caused the error.
                          x-gitbook-description-html: <p>The name of the field that caused the error.</p>
                        level:
                          type: string
                          description: The severity of the error.
                          x-gitbook-description-html: <p>The severity of the error.</p>
                        message:
                          type: string
                          description: A human-readable error message.
                          x-gitbook-description-html: <p>A human-readable error message.</p>
                    x-gitbook-description-html: >-
                      <p>One or more validation errors describing what was wrong
                      with the request.</p>
          x-gitbook-description-html: >-
            <p>Bad Request. The request was invalid, likely due to missing
            required fields or incorrect data formats.</p>
