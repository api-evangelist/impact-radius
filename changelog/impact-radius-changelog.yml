- version: brand-v13
  breaking: false
  highlights:
  - Application Processing API — Contracts endpoint gained POST (accept partner applications
    with optional groupId) and DELETE (decline proposals with optional reason and groupId).
  - New PromoCodeExceptionLists endpoint (create, update, retrieve, delete).
  - Scoped Tokens — API credentials with fine-grained per-endpoint permissions.
  - New Upload endpoint for batch catalog uploads.
  - Contracts API responses now include a ScheduledTerms object when relevant.
  - Rate-limit changes announced — ReportExport 100 requests/day, ClickExport 10 requests/day
    (enforcement deferred to the new year).
  - ReportExport recommended as the migration path off the legacy Reports API before 2025-09-01.
