standards:
- id: openapi
  version: 3.1.0 (Brand v14 / Partner v15 / Advocate); 3.0 declared on Agency v3
  conforms: true
  evidence: >-
    67 machine-readable documents published and served from
    openapi.gitbook.com/o/0mbgBjArWXoMupyWdFkH/spec/, linked from the Brand, Partner, Agency and
    Advocate reference sets on integrations.impact.com. All 67 parse and declare paths; 242
    operations carry explicit operationIds and servers[] naming api.impact.com or
    app.referralsaasquatch.com.
- id: graphql
  conforms: true
  evidence: >-
    Advocate GraphQL endpoint at app.referralsaasquatch.com/api/v1/{tenant_alias}/graphql.
    Anonymous introspection returned a complete 543-type schema (118 Query fields, 138 Mutation
    fields) on 2026-08-13; SDL saved to graphql/impact-radius-advocate-schema.graphql.
- id: mcp
  conforms: true
  evidence: >-
    First-party remote MCP endpoint at https://mcp.impact.com/mcp with a published tool catalog
    (18 distinct tools) and first-party MCP Skills. tools/list returns 401 without OAuth, which
    is correct MCP behaviour for a gated server.
- id: rfc9457
  name: Problem Details for HTTP APIs
  conforms: false
  evidence: >-
    No application/problem+json media type appears in any of the 67 specs. Errors use a vendor
    envelope {Status, Message, Errors[{Field, Message}]} in JSON or XML.
- id: idempotency
  conforms: false
  evidence: >-
    No idempotency-key header, no replay-safe POST contract in the docs, and no such parameter in
    any of the 242 operations. The provider's own LLM-integration guidance tells clients to
    "implement idempotency patterns where replay is safe" — the primitive is not server-side.
- id: pagination
  conforms: true
  evidence: >-
    Documented, uniform page-number pagination with Page/PageSize request parameters and a
    self-navigating response envelope (@page, @numpages, @pagesize, @total, @start, @end, @uri,
    @firstpageuri, @nextpageuri, @previouspageuri, @lastpageuri).
- id: ratelimit-headers
  name: draft-polli-ratelimit-headers
  conforms: partial
  evidence: >-
    Returns X-RateLimit-Limit / X-RateLimit-Remaining / X-RateLimit-Reset with 429 on exhaustion,
    and the docs cite draft-polli-ratelimit-headers-02 §3.3 for the Reset semantics. Uses the
    legacy X- prefixed names, not the RFC 9238-style RateLimit-* field names.
- id: rfc8594
  name: Sunset HTTP Header
  conforms: false
