aid: impact-radius
name: Impact Radius
description: Impact Radius, now operating as impact.com, is a partnership management platform for managing
  affiliate programs, influencer and creator partnerships, and customer referral (Advocate) initiatives
  at scale. Brands, agencies, and publishers use it to discover and recruit partners, contract and pay
  them against business outcomes, track partner-driven traffic and conversions with privacy-first attribution
  across devices, protect programs from fraud, and optimize performance with predictive analytics. The
  platform publishes 67 machine-readable OpenAPI 3.1 documents covering 242 operations across Brand (v14),
  Partner (v15), Agency (v3) and Advocate (v1) REST APIs, an openly introspectable Advocate GraphQL schema,
  webhooks and event notifications, mobile and browser SDKs, an official hosted MCP server with a published
  18-tool catalog and first-party MCP Skills, and llms.txt plus per-page markdown for agent and AI-assisted
  integration.
