aid: impact-radius
name: Impact Radius
description: >-
  Impact Radius, now operating as impact.com, is a partnership management platform for
  managing affiliate programs, influencer and creator partnerships, and customer referral
  (advocate) initiatives at scale. Brands, agencies, and publishers use it to discover and
  recruit partners, contract and pay them against business outcomes, track partner-driven
  traffic and conversions with privacy-first attribution across devices, protect programs
  from fraud, and optimize performance with predictive analytics. The platform exposes REST
  APIs for Brands, Partners (media partners), and Agencies, plus Advocate program APIs with
  webhooks, GraphQL, mobile SDKs, an official hosted MCP server, and machine-readable docs
  (llms.txt and OpenAPI) for agent and AI-assisted integration.
