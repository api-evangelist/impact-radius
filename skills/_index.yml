cross_cutting_rules:
  note: Every skill restates these because they change the shape of a correct integration.
  rules:
  - No idempotency key exists on any of the 242 operations; retries are real second mutations.
  - Pagination is Page/PageSize with a self-navigating @nextpageuri envelope.
  - 1,000 requests/hour default; 3,600/hour on /Catalogs; 100/day ReportExport; 10/day ClickExport.
  - Errors are a vendor envelope {Status, Message, Errors[{Field, Message}]}, not RFC 9457.
  - 403 means the scoped token does not enable the endpoint; 401 means the credentials are wrong.
  - Pin IR-Version (or IrVersion) per request; the account default can be changed underneath you.
