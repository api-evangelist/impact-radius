"""
An input object specifying the details of a user event.

Events have a `key` to specify the type of the event, and an arbitrary JSON object
which holds the `fields`.

Events are processed immediately, but you can specify the `dateTriggered` indicating
when the event actually took place.
"""
input UserEventDataInput {
  """Deprecated. This field is ignored."""
  id: ID
  """The key of the event, like `purchase` or `refund`."""
  key: String!
  """
  The fields of the event, which can be an arbitrary JSON object.

A an example event may contain the fields:

```json
{
  "currency": "USD",
  "revenue": 50
}
```
  """
  fields: RSJsonNode
  """
  The trigger date of an event indicates when the event took place.

Specifying `dateTriggered` is optional - if it is not provided then the event
is assumed to have taken place at the time that it is received.
  """
  dateTriggered: RSDate
}

"""An input object to associate one or more events with a user."""
input UserEventInput {
  """The id of the user to associate the events with."""
  userId: String!
  """The account id of the user to associate the events with."""
  accountId: String!
  """
  The idempotency key for a logUserEvent request.

To prevent processing an event more than once, you can provide an idempotency
key to achieve "at most once" processing semantics. The idempotency key
uniquely identifies the event, and is generated by the caller.

The idempotency key can be any string identifier that your system associates
with the event, with the following restrictions:

- It must be at least 8 characters long
- It must be no more than 64 characters long
- It can only contain alphanumerics characters, as well as the `.`, `-`,
  or `_` characters

For example, a good choice for an idempotency key is a UUID, in particular
a random version 4 UUID like `ec524601-975c-458a-9948-ae4448ce8944`.

Idempotency keys are guaranteed to be stored by SaaSquatch for at least 24 hours,
such that any event inputs with the same idempotency key within 24 hours will
be guaranteed to process the events only once.

Subsequent attempts to process an event with an idempotency key that has already
been processed once will result in an HTTP 409 Conflict response, so you will
need to ensure that you are handling this status code in your request logic.
  """
  idempotencyKey: String
  """A list of `UserEventDataInput` objects which specify the details of the events."""
  events: [UserEventDataInput!]
}

