versioning:
  scheme: account-pinned major version, overridable per request
  current:
    brand: v14
    partner: v15
    agency: v3
    advocate: v1
  release_history:
  - version: '11'
    released: '2022-10-12'
  - version: '12'
    released: '2024-05-06'
  - version: '13'
    released: '2025-03-01'
  - version: '14'
    released: '2026-06-01'
  override:
    query_param: IrVersion
    header: IR-Version
  breaking_change_definition:
  - Resources or fields are removed from responses
  - The meaning (Type) of an attribute changes
  non_breaking:
  - New resources added to the API
  - New fields added to an existing resource
  notes: >-
    Each API is versioned as a distinct major reference set. Brand v11, v12, v13 and v14 all
    remain published side by side; Partner keeps v14 and v15; Agency keeps v2 and v3. The
    account's API settings pin a default version, and any single request may override it with
    IrVersion / IR-Version — which makes A/B testing a version upgrade a supported, documented
    practice rather than a cutover.
  supported_versions:
    brand: [v11, v12, v13, v14]
    partner: [v14, v15]
    agency: [v2, v3]
