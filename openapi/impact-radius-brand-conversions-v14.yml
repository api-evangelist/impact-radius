components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    ConversionPayload:
      type: object
      required:
        - CampaignId
        - EventDate
        - OrderId
      properties:
        EventTypeId:
          type: integer
          description: Unique identifier for the event type (action tracker).
          example: 8180
          x-tags:
            - Event ID
          x-gitbook-description-html: <p>Unique identifier for the event type (action tracker).</p>
        EventTypeCode:
          type: string
          description: Configurable string code for the event type.
          example: ACME_SALE
          x-tags:
            - Event ID
          x-gitbook-description-html: <p>Configurable string code for the event type.</p>
        ClickId:
          type: string
          description: Unique identifier of a referring click.
          example: QiiWXOVnrQ3SQHl24jQjyxBGUkmzfJ3i1VHrWM0
          x-tags:
            - Attribution key
          x-gitbook-description-html: <p>Unique identifier of a referring click.</p>
        CustomerId:
          type: string
          description: Your unique, non-PII identifier for the customer.
          example: BCZ2WVSH674563PDPYOTM3AXDQ
          x-tags:
            - Attribution key
          x-gitbook-description-html: <p>Your unique, non-PII identifier for the customer.</p>
        CustomProfileId:
          type: string
          description: Unique identifier for a visitor on your website.
          example: a1b2c3d4e5f6
          x-tags:
            - Attribution key
          x-gitbook-description-html: <p>Unique identifier for a visitor on your website.</p>
        OrderPromoCode:
          type: string
          description: >-
            Promo code used for the order. Used for attribution if assigned to a
            specific partner.
          example: 10OFF-ROCKET
          x-tags:
            - Attribution key
          x-gitbook-description-html: >-
            <p>Promo code used for the order. Used for attribution if assigned
            to a specific partner.</p>
        UniqueUrl:
          type: string
          format: uri
          description: Unique URL of a partner that referred the conversion.
          x-tags:
            - Attribution key
          x-gitbook-description-html: <p>Unique URL of a partner that referred the conversion.</p>
        GoogAId:
          type: string
          description: Google Advertising ID.
          example: 38400000-8cf0-11bd-b23e-10b96e40000d
          x-tags:
            - Attribution key
          x-gitbook-description-html: <p>Google Advertising ID.</p>
        AppleIfa:
          type: string
          description: Apple ID for Advertising (IDFA).
          example: 38400000-8cf0-11bd-b23e-10b96e40000d
          x-tags:
            - Attribution key
          x-gitbook-description-html: <p>Apple ID for Advertising (IDFA).</p>
        AppleIfv:
          type: string
          description: Apple ID for Vendors (IDFV).
          example: 38400000-8cf0-11bd-b23e-10b96e40000d
          x-tags:
            - Attribution key
          x-gitbook-description-html: <p>Apple ID for Vendors (IDFV).</p>
        MediaId:
          type: integer
          description: >-
            Force attribution to a specific partner ID. Interchangeable with
            `MediaPartnerId` — provide either one, not both. Use with
            caution.
          example: 10000
          x-tags:
            - Attribution key
          x-gitbook-description-html: >-
            <p>Force attribution to a specific partner ID. Interchangeable
            with <code>MediaPartnerId</code> — provide either one, not both.
            Use with caution.</p>
        MediaPartnerId:
          type: integer
          description: >-
            Force attribution to a specific partner ID. Interchangeable with
            `MediaId` — provide either one, not both. Use with caution.
          example: 10000
          x-tags:
            - Attribution key
          x-gitbook-description-html: >-
            <p>Force attribution to a specific partner ID. Interchangeable
            with <code>MediaId</code> — provide either one, not both. Use
            with caution.</p>
        SubId1:
          type: string
          maxLength: 255
          description: >-
            Only used if you are specifying the MediaId/MediaPartnerId
            directly and have no other means to tie this conversion to a
            click or impression. Custom text field typically used by
            partners to segment their traffic.
          example: subid1value
          x-gitbook-description-html: >-
            <p>Only used if you are specifying the
            <code>MediaId</code>/<code>MediaPartnerId</code> directly and
            have no other means to tie this conversion to a click or
            impression. Custom text field typically used by partners to
            segment their traffic.</p>
        SubId2:
          type: string
          maxLength: 255
          description: >-
            Only used if you are specifying the MediaId/MediaPartnerId
            directly and have no other means to tie this conversion to a
            click or impression. Custom text fields typically used by
