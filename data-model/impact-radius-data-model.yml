description: >-
  Entity-relationship graph for the impact.com platform, derived mechanically from $ref links and
  id-reference fields in the harvested OpenAPI documents. Two distinct object graphs live under
  one brand: the partnership graph on api.impact.com (Campaign/Program at the centre) and the
  Advocate referral graph on app.referralsaasquatch.com (Tenant/User at the centre). They are
  joined only at the product level, not by shared identifiers.
identifiers:
  style: numeric-and-opaque
  account_key:
    name: AccountSID
    description: >-
      Path-level tenant key on every api.impact.com route. Doubles as the HTTP Basic username, so
      identity and addressing are the same value.
    example_shape: IR + alphanumeric (e.g. IRyMQiCNtwrt1804207G3t8Pn6NyzfyDw1)
  advocate_key:
    name: tenant_alias
    description: Path-level tenant key on every app.referralsaasquatch.com/api/v1 route.
  conventions:
  - "Partnership graph uses PascalCase foreign keys ending in Id (CampaignId, MediaPartnerId, AdId)."
  - "Advocate graph uses camelCase foreign keys ending in Id (programId, userId, accountId, referralId)."
  - "No global URN or type-prefixed id scheme (no `act_`/`cus_` style prefixes) is used anywhere."
  - >-
    CampaignId and Program are the same concept under two names — Program.CampaignId is the join,
    a legacy of the platform's Campaign-era vocabulary.
