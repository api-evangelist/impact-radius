    impact.com's own GraphQL API guide publishes this host as the Advocate endpoint —
    "https://app.referralsaasquatch.com/api/v1/{tenant_alias}/graphql" — because Advocate is the
    productised Referral SaaSquatch acquisition. Different domain, same company, stated by the
    provider's documentation.
endpoints:
