      actions.
  - name: Partner Weekly Performance Digest
    audience: partner
    url: https://integrations.impact.com/ai-solutions/mcp-skills/partner-skills/partner-weekly-performance-digest.md
  note: >-
    The skill bodies are rendered in-page as GitBook cards and are NOT present in the .md export
